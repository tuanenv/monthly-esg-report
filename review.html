<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Analyst review page for Monthly ESG Intelligence report">
<title>Review: Monthly ESG Intelligence</title>

<link rel="preload" href="./assets/fonts/ptt45pride-regular.woff2" as="font" type="font/woff2" crossorigin>

<link rel="preload" href="./assets/fonts/ptt45pride-bold.woff2" as="font" type="font/woff2" crossorigin>

<link rel="stylesheet" href="./assets/css/report.css">

<link rel="stylesheet" href="./assets/css/review.css">
  
</head>

<body data-render-status="loading">
<header class="review-topbar">
<div class="review-topbar-title">
<strong>Analyst Review</strong>
<span>Monthly ESG Intelligence Report</span>
</div>
<span id="edit-status-pill" class="status-pill status-draft">DRAFT</span>
<div class="review-actions">
<button id="btn-toggle-edit" type="button" class="btn btn-secondary">เปิดโหมดแก้ไข</button>
<input id="input-reviewed-by" type="text" placeholder="ชื่อผู้ตรวจสอบ" class="toolbar-input">
<input id="input-approval-comment" type="text" placeholder="ความเห็นประกอบ (ถ้ามี)" class="toolbar-input toolbar-input-wide">
<button id="btn-save-export" type="button" class="btn btn-primary">บันทึกและส่งออก (JSON + PNG)</button>
</div>
</header>
<main id="report" class="page" aria-live="polite">
<div class="loading">กำลังโหลดรายงาน...</div>
</main>
<noscript>
<div class="error">หน้า Review นี้จำเป็นต้องเปิดใช้งาน JavaScript</div>
</noscript>

<script>window.SKIP_AUTO_LOAD = true;</script>
<script src="./js/report.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="./js/review.js"></script>
</body>
</html>
