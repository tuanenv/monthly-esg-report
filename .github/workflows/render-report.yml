name: Render Monthly ESG Report

on:
  workflow_dispatch:
    inputs:
      format:
        description: "Output format"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - png
          - pdf
      allow_unapproved:
        description: "Bypass approval check (testing only)"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      publish_output:
        description: "Commit output files back to repo for GitHub Pages"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

jobs:
  render-report:
    name: Render report to PNG and PDF
    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Create output directory
        run: mkdir -p output

      - name: Render report
        env:
          ALLOW_UNAPPROVED_RENDER: ${{ inputs.allow_unapproved }}
          PUBLISH_OUTPUT: ${{ inputs.publish_output }}
        run: npm run render:${{ inputs.format }}

      - name: List generated output
        run: |
          echo "Generated files:"
          find output -maxdepth 1 -type f -print

      - name: Upload rendered report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: monthly-esg-report-${{ inputs.format }}
          path: output/
          if-no-files-found: error
          retention-days: 30

      - name: Commit output to repository
        if: ${{ inputs.publish_output == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --cached --quiet || git commit -m "Publish rendered report output [skip ci]"
          git push
